[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-space"
version = "0.10.0"
description = "One domain ontology definition, executed on whatever database, graph store or reasoner a deployment has: a query IR compiled to SQL, Cypher, GQL, SPARQL, SQL/PGQ and Gremlin, with computed properties, decisions, actions, roles, reviewed definition changes, an asset graph and conformance tests."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jinsoo96", email = "wlstn010203@gmail.com" }]
keywords = [
    "ontology", "knowledge-graph", "semantic-layer", "sparql", "cypher", "gql", "sql-pgq", "r2rml",
    "shacl", "owl", "decision-table", "mcp", "gremlin",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: Other/Proprietary License",
]
dependencies = []

[project.urls]
Repository = "https://github.com/PlateerLab/xgen-space"
Changelog = "https://github.com/PlateerLab/xgen-space/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ontology and studio files in YAML (JSON needs nothing).
yaml = ["pyyaml>=6"]
# The in-process RDF backend, SPARQL reading, OWL import.
rdf = ["rdflib>=7"]
# SQL dialects beyond PostgreSQL and SQLite (MySQL, Oracle, SQL Server, Snowflake, BigQuery, ...).
sql = ["sqlglot>=25"]
# SHACL validation of a projection against the generated shapes.
shacl = ["pyshacl>=0.26", "rdflib>=7"]
# OWL 2 RL materialization.
owl = ["owlrl>=7", "rdflib>=7"]
# Decision tables on the GoRules ZEN engine.
zen = ["zen-engine>=2"]
postgres = ["psycopg[binary]>=3"]
mysql = ["pymysql>=1.1", "sqlglot>=25"]
oracle = ["oracledb>=2", "sqlglot>=25"]
neo4j = ["neo4j>=5"]
gremlin = ["gremlinpython>=3.7"]
mcp = ["mcp>=1.2"]
# Drafting from Excel workbooks.
xlsx = ["openpyxl>=3.1"]
# Reading PDF documents.
pdf = ["pypdf>=4"]
# A small multilingual embedding model on the CPU. The hash embedder needs nothing; an OpenAI-shaped service needs nothing here.
embed = ["fastembed==0.7.3"]
# A second OWL 2 RL engine, compared with owlrl by `xspace reasoners`.
reasonable = ["reasonable==0.4.4", "rdflib>=7"]
all = ["pyyaml>=6", "rdflib>=7", "sqlglot>=25", "pyshacl>=0.26", "owlrl>=7", "zen-engine>=2", "mcp>=1.2", "openpyxl>=3.1", "pypdf>=4"]
# The live-server tests (tests/test_live.py): drivers for PostgreSQL, Neo4j and Gremlin Server.
live = ["psycopg[binary]>=3", "neo4j>=5", "gremlinpython>=3.7", "pymysql>=1.1"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
xspace = "xgen_space.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_space"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
