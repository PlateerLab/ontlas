library: .
name: studio
namespace: https://example.org/studio#
now: "2026-10-30T12:00:00"
notice: 가상 예시 데이터
modules: [core, commerce, commerce-bindings, commerce-operations, commerce-operations-bindings, fashion, acme-overlay, commerce-law]
flow:
  gates:
    bind: {max_errors: 0}
    index: {min_found: 0.8}
    query: {min_agree: 1.0}
    decide: {min_agreement: 0.8}
    check: {min_accuracy: 0.9, max_value_errors: 0}
  agreement:
    decision: returnEligibility
    query: pastReturnCases
    inputs: {days_since_delivery: days_after_delivery, item_status: status_then,
             category_returnable: returnable_then, customer_grade: grade_then}
    expect: {eligible: approved}
  values:
    - {name: shipping, label: 배송비, query: checkoutRecords, key: order_id, truth: charged_shipping,
       answer: {decision: shippingFee, output: fee}}
    - {name: price, label: 판매가, query: checkoutRecords, key: sku_id, truth: shown_price,
       answer: {type: Sku, property: price}}
    - {name: soldOut, label: 품절, query: checkoutRecords, key: sku_id, truth: shown_sold_out,
       answer: {function: soldOut, output: sold_out}}
monitor:
  faults:
    - {label: 식품 업종 모듈 적용, attach: food}
space:
  documents: ["../documents/*.md", "../policies/*.md"]
  checks:
    - {text: 포장을 뜯은 속옷도 돌려보낼 수 있나요, document: 반품정책서}
    - {text: 택배가 일주일째 안 와요, document: 배송안내}
    - {text: 가상계좌 입금을 안 하면 어떻게 되나요, document: 결제환불안내}
    - {text: 쿠폰 두 장을 같이 쓸 수 있나요, document: 쿠폰약관}
    - {text: 판매 수수료는 얼마인가요, document: 판매자운영기준}
    - {text: 나쁜 후기를 판매자가 지울 수 있나요, document: 상품평운영기준}
backends:
  source: {kind: sqlite, path: ":memory:", seed: [../commerce/seed.sql, seed_operations.sql], source: true}
  graph: {kind: rdflib}
project: [graph]
