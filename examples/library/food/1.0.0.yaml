module: food
version: 1.0.0
kind: industry
label: 식품 업종 확장
description: 식품 업종의 유통기한, 보관 방식 속성을 이커머스 표준에 추가합니다. 예시 스페이스에는 적용되어 있지 않습니다.
requires: [commerce]

extend:
  objects:
    Sku:
      properties:
        expires_on: {type: date, label: 유통기한}
        storage: {type: enum, values: [ROOM, CHILLED, FROZEN], label: 보관 방식}

queries:
  expiringBefore:
    label: 유통기한 임박 단품
    params: {before: date}
    example: {before: "2026-11-15"}
    query:
      match: {s: Sku}
      where: {lt: [s.expires_on, {param: before}]}
      return: [s.sku_id, s.expires_on, s.storage]
      order: [expires_on]
