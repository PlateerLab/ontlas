module: acme-overlay
version: 1.0.0
kind: customer
label: 고객사 차이 · ACME
description: 고객사별 차이를 표준 위에 추가합니다. 선물 포장 속성, VIP 반품 기간 연장 규칙, 찜 질의 제외.
requires: [commerce, commerce-bindings]

objects:
  ReturnCase:
    label: 반품 처리 기록
    description: 상담원이 실제로 처리한 반품 건과 그때의 값. 결정표 판정과 비교해 판정 일치율을 측정합니다.
    area: Claim
    source: {table: return_cases}
    key: case_id
    properties:
      case_id: {type: string, label: 처리 번호, required: true}
      item_id: {type: string, label: 주문상품 번호}
      decided_at: {type: datetime, label: 처리 일시}
      days_after_delivery: {type: integer, label: 배송 후 경과일}
      status_then: {type: string, label: 그때 주문상품 상태}
      returnable_then: {type: boolean, label: 그때 카테고리 반품 가능}
      grade_then: {type: string, label: 그때 고객 등급}
      approved: {type: boolean, label: 실제 승인}

queries:
  pastReturnCases:
    label: 지난 반품 처리
    query:
      match: {r: ReturnCase}
      return: [r.case_id, r.days_after_delivery, r.status_then, r.returnable_then, r.grade_then, r.approved]
      order: [case_id]

extend:
  objects:
    OrderItem:
      properties:
        gift_wrap: {type: boolean, label: 선물 포장}
  decisions:
    returnEligibility:
      inputs:
        customer_grade: {type: string, path: [itemOf, placedBy], property: grade}
      rules_prepend:
        - id: vip-window
          when: {customer_grade: '"VIP"', days_since_delivery: "<= 14", item_status: '"NORMAL"', category_returnable: "true"}
          then: {eligible: true, reason: VIP 고객은 배송 완료 후 14일까지 반품할 수 있습니다}
          cite: ACME 운영 정책 4.1

remove:
  queries: [wishlistCount]

rule_cards:
  - id: acme-vip-window
    type: decide
    statement: VIP 고객은 배송 완료 후 14일까지 반품할 수 있습니다.
    applies_to: [object:OrderItem, object:Customer]
    conditions: [고객 등급 VIP, 주문상품 상태 정상, 반품 가능 카테고리]
    result: 배송 완료 후 14일 이내이면 반품 가능
    params: {days: 14}
    source: ACME 운영 정책 4.1
    owner: 고객경험팀
    status: approved
    legal_review: done
    implements: [decision:returnEligibility#vip-window]

questions:
  - {id: A1, text: "VIP 고객의 I1001 은 어떤 규칙으로 반품되나요?", decision: returnEligibility, key: I1001, expect: {eligible: true, reason: VIP 고객은 배송 완료 후 14일까지 반품할 수 있습니다},
     values: {days_since_delivery: 4, item_status: NORMAL, category_returnable: true, customer_grade: VIP}}
