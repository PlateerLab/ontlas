module: commerce-operations
version: 1.0.0
kind: domain
label: 이커머스 운영 온톨로지
description: 판매자, 결제, 환불, 배송, 택배사, 쿠폰, 상품평과 배송비 판정을 정의합니다
requires: [commerce]

parameters:
  price_auto_percent: {type: integer, value: 10, min: 0, max: 100, unit: "%", label: 판매가 자동 변경 허용 폭, cite: 가격 운영 기준 v1.0 2조}
  free_shipping_amount: {type: integer, value: 50000, min: 0, unit: 원, label: 무료 배송 기준 금액, cite: 배송비 정책서 v1.0 2조}
  base_shipping_fee: {type: integer, value: 3000, min: 0, unit: 원, label: 기본 배송비, cite: 배송비 정책서 v1.0 2조}

functions:
  refundEstimate:
    label: 예상 환불 금액
    description: 결제 금액에서 수수료율만큼 뺀 금액입니다
    target: OrderItem
    version: 1.0.0
    owner: 정산팀
    inputs:
      fee_rate: {type: decimal, label: 수수료율, required: false, default: 0, min: 0, max: 1}
    outputs: {amount: decimal}
    expr: "line_total * (1 - @fee_rate)"
    cite: 결제환불안내 환불 금액
  soldOut:
    label: 품절 여부
    description: 재고가 없으면 품절입니다
    target: Sku
    version: 1.0.0
    owner: 상품운영팀
    outputs: {sold_out: boolean}
    expr: "stock = 0"
  orderShipping:
    label: 주문 배송비
    runtime: decision
    target: Order
    decision: shippingFee
    version: 1.0.0
    owner: 물류운영팀
    outputs: {fee: decimal, reason: string}
    cite: 배송비 정책서 v1.0 2조

actions:
  changePrice:
    label: 판매가 변경
    target: Sku
    cite: 가격 운영 기준 v1.0 2조
    parameters:
      price: {type: decimal, label: 새 판매가, min: 0}
    set: {price: $price}
    approval:
      auto_within:
        - {property: price, percent: "@price_auto_percent"}

metrics:
  returnRate:
    label: 반품률
    owner: 고객경험팀
    unit: "%"
    scale: 100
    description: 배송을 마친 주문상품 가운데 반품을 마친 비율
    formula: {match: {i: OrderItem}, where: {eq: [i.item_status, RETURNED]}, value: {count: i}}
    denominator: {where: {not_null: i.delivered_at}, value: {count: i}, label: 배송 완료 주문상품}
    time: {property: i.delivered_at, basis: 배송 완료 시각}

conflicts:
  vipExchangeWindow:
    label: VIP 교환 기간
    answers:
      - {source: 교환 정책서 2조, says: {days: 30}}
      - {source: 고객센터 안내문, says: {days: 14}}

objects:
  CheckoutRecord:
    label: 결제 화면 기록
    description: 결제 화면이 고객에게 보여 준 값입니다
    key: record_id
    properties:
      record_id: {type: string, label: 기록 번호, required: true}
      order_id: {type: string, label: 주문 번호}
      sku_id: {type: string, label: 단품 번호}
      charged_shipping: {type: decimal, unit: KRW, label: 청구 배송비}
      shown_price: {type: decimal, unit: KRW, label: 표시 판매가}
      shown_sold_out: {type: boolean, label: 품절 표시}

  Seller:
    label: 판매자
    parent: Party
    key: seller_id
    aligned: [https://schema.org/Organization]
    properties:
      seller_id: {type: string, label: 판매자 번호, required: true}
      commission_rate: {type: decimal, label: 수수료율}

  Payment:
    label: 결제
    key: payment_id
    aligned: [https://schema.org/Invoice]
    properties:
      payment_id: {type: string, label: 결제 번호, required: true}
      order_id: {type: string, label: 주문 번호}
      method:
        type: enum
        label: 결제 수단
        values: {CARD: 신용카드, EASY_PAY: 간편결제, BANK_TRANSFER: 계좌이체, VIRTUAL_ACCOUNT: 가상계좌}
      amount: {type: decimal, unit: KRW, label: 결제 금액}
      paid_at: {type: datetime, label: 결제 일시}
      pay_status:
        type: enum
        label: 결제 상태
        values: {PENDING: 입금 대기, APPROVED: 승인, CANCELLED: 취소}

  Refund:
    label: 환불
    key: refund_id
    properties:
      refund_id: {type: string, label: 환불 번호, required: true}
      claim_id: {type: string, label: 클레임 번호}
      payment_id: {type: string, label: 결제 번호}
      amount: {type: decimal, unit: KRW, label: 환불 금액}
      requested_at: {type: datetime, label: 요청 일시}
      refund_status:
        type: enum
        label: 환불 상태
        values: {REQUESTED: 요청, DONE: 완료}

  Carrier:
    label: 택배사
    key: carrier_id
    title: name
    implements: [Named]
    properties:
      carrier_id: {type: string, label: 택배사 번호, required: true}
      name: {type: string, label: 택배사명}

  Shipment:
    label: 배송
    key: shipment_id
    aligned: [https://schema.org/ParcelDelivery]
    properties:
      shipment_id: {type: string, label: 배송 번호, required: true}
      order_id: {type: string, label: 주문 번호}
      carrier_id: {type: string, label: 택배사 번호}
      tracking_no: {type: string, label: 운송장 번호}
      shipped_at: {type: datetime, label: 출고 일시}
      delivered_at: {type: datetime, label: 배송 완료 일시}
      ship_status:
        type: enum
        label: 배송 상태
        values: {IN_TRANSIT: 배송 중, DELIVERED: 배송 완료}

  Coupon:
    label: 쿠폰
    key: coupon_id
    title: name
    implements: [Named]
    aligned: [https://schema.org/Offer]
    properties:
      coupon_id: {type: string, label: 쿠폰 번호, required: true}
      name: {type: string, label: 쿠폰명}
      discount_percent: {type: decimal, unit: "%", label: 할인율, column: discount_rate, transform: "value * 100"}
      discount_rate: {type: decimal, label: 할인율}
      min_amount: {type: decimal, unit: KRW, label: 최소 주문 금액}
      expires_at: {type: datetime, label: 만료 일시}

  Review:
    label: 상품평
    key: review_id
    aligned: [https://schema.org/Review]
    properties:
      review_id: {type: string, label: 상품평 번호, required: true}
      customer_id: {type: string, label: 고객 번호}
      product_id: {type: string, label: 상품 번호}
      rating: {type: integer, label: 평점}
      written_at: {type: datetime, label: 작성 일시}
      body: {type: string, label: 내용}

links:
  recordOf: {from: CheckoutRecord, to: Order, cardinality: many_to_one, label: 기록한 주문}
  soldBy: {from: Product, to: Seller, inverse: sells, label: 판매자}
  paidWith: {from: Order, to: Payment, cardinality: one_to_many, inverse: paymentOf, label: 결제}
  hasRefund: {from: Claim, to: Refund, cardinality: one_to_many, inverse: refundOf, label: 환불}
  refundedFrom: {from: Refund, to: Payment, cardinality: many_to_one, inverse: refunds, label: 환불 결제}
  shippedBy: {from: Order, to: Shipment, cardinality: one_to_many, inverse: shipmentOf, label: 배송}
  carriedBy: {from: Shipment, to: Carrier, cardinality: many_to_one, inverse: carries, label: 택배사}
  usedCoupon: {from: Order, to: Coupon, inverse: usedIn, label: 사용 쿠폰}
  wrote: {from: Customer, to: Review, cardinality: one_to_many, inverse: writtenBy, label: 작성}
  reviews: {from: Review, to: Product, cardinality: many_to_one, inverse: reviewedIn, label: 상품}

decisions:
  shippingFee:
    label: 배송비
    target: Order
    cite: 배송비 정책서 v1.0 2조
    hit_policy: first
    inputs:
      order_total: {type: decimal, property: total}
      order_status: {type: string, property: status}
    outputs: {fee: decimal, reason: string}
    rules:
      - {id: cancelled, when: {order_status: '= "CANCELLED"'}, then: {fee: 0, reason: 취소된 주문은 배송비가 없습니다}}
      - {id: free, when: {order_total: ">= @free_shipping_amount"}, then: {fee: 0, reason: "{@free_shipping_amount}원 이상 주문은 무료 배송입니다"}}
      - {id: basic, when: {}, then: {fee: "@base_shipping_fee", reason: "기본 배송비 {@base_shipping_fee}원입니다"}}

queries:
  checkoutRecords:
    label: 결제 화면 기록
    query:
      match: {r: CheckoutRecord}
      return: [r.record_id, r.order_id, r.sku_id, r.charged_shipping, r.shown_price, r.shown_sold_out]
      order: [record_id]
  namedThings:
    label: 이름이 있는 항목 전체
    description: 고객, 판매자, 카테고리, 상품, 택배사, 쿠폰을 유형과 관계없이 조회합니다
    query:
      match: {x: Named}
      return: [x.name]
      order: [name]
  paymentsByMethod:
    label: 결제 수단별 금액
    query:
      match: {p: Payment}
      where: {eq: [p.pay_status, APPROVED]}
      return: [p.method, {sum: p.amount, as: amount}, {count: p, as: payments}]
      order: [-amount]
  pendingRefunds:
    label: 처리 중인 환불
    query:
      match: {r: Refund, c: Claim}
      edges: [[c, hasRefund, r]]
      where: {eq: [r.refund_status, REQUESTED]}
      return: [r.refund_id, c.reason, r.amount, r.requested_at]
      order: [requested_at]
  shipmentsInTransit:
    label: 배송 중인 주문
    query:
      match: {o: Order, s: Shipment, k: Carrier}
      edges: [[o, shippedBy, s], [s, carriedBy, k]]
      where: {eq: [s.ship_status, IN_TRANSIT]}
      return: [o.order_id, {col: k.name, as: carrier}, s.tracking_no, s.shipped_at]
      order: [shipped_at]
  carrierLoad:
    label: 택배사별 배송 건수
    query:
      match: {s: Shipment, k: Carrier}
      edges: [[s, carriedBy, k]]
      return: [{col: k.name, as: carrier}, {count: s, as: shipments}]
      order: [-shipments]
  sellerRevenue:
    label: 판매자별 매출
    query:
      match: {o: Order, i: OrderItem, s: Sku, p: Product, v: Seller}
      edges: [[o, hasItem, i], [i, ofSku, s], [s, skuOf, p], [p, soldBy, v]]
      where: {ne: [o.status, CANCELLED]}
      return: [{col: v.name, as: seller}, {sum: i.line_total, as: revenue}, {count: i, as: items}]
      order: [-revenue]
  couponUsage:
    label: 쿠폰별 사용 주문 수
    query:
      match: {o: Order, c: Coupon}
      edges: [[o, usedCoupon, c]]
      return: [{col: c.name, as: coupon}, {count: o, as: orders}]
      order: [-orders]
  productRatings:
    label: 상품별 평균 평점
    query:
      match: {r: Review, p: Product}
      edges: [[r, reviews, p]]
      return: [{col: p.name, as: product}, {avg: r.rating, as: rating}, {count: r, as: reviews}]
      order: [-rating]

questions:
  - {id: OP1, text: "지금 배송 중인 주문은 몇 건인가요?", query: shipmentsInTransit, expect: {rows: 5}}
  - {id: OP2, text: "처리 중인 환불은 몇 건인가요?", query: pendingRefunds, expect: {rows: 1}}
  - {id: OP3, text: "승인된 결제에 쓰인 결제 수단은 몇 가지인가요?", query: paymentsByMethod, expect: {rows: 4}}
  - {id: OP4, text: "9만 7천원 주문 O1 의 배송비는 얼마인가요?", decision: shippingFee, key: O1, expect: {fee: 0, reason: "50,000원 이상 주문은 무료 배송입니다"}}
  - {id: OP5, text: "취소된 주문 O4 의 배송비는 얼마인가요?", decision: shippingFee, key: O4, expect: {fee: 0, reason: 취소된 주문은 배송비가 없습니다}}
  - {id: OP6, text: "3만 8천원 주문 O16 의 배송비는 얼마인가요?", decision: shippingFee, key: O16, expect: {fee: 3000}}
