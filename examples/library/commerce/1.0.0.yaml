module: commerce
version: 1.0.0
kind: domain
label: 이커머스 표준 온톨로지
description: 고객, 주문, 주문상품, 단품, 상품, 카테고리, 클레임과 반품 판정을 정의합니다. 원천 테이블 연결은 Binding 모듈에서 관리합니다.
requires: [core]

areas:
  Customer:
    label: 고객
    description: 상품을 주문하는 회원과 회원 등급
  Product:
    label: 상품
    description: 판매하는 상품과 단품, 판매가 변경 이력
    aligned: [https://schema.org/Product]
  Category:
    label: 카테고리
    description: 상품을 묶는 분류 체계
  Order:
    label: 주문
    description: 주문과 주문에 담긴 주문상품
    aligned: [https://schema.org/Order]
  Claim:
    label: 클레임
    description: 주문 뒤에 접수되는 반품 · 교환 · 취소

objects:
  Customer:
    label: 고객
    area: Customer
    parent: Party
    key: customer_id
    aligned: [https://schema.org/Person]
    properties:
      customer_id: {type: string, label: 고객 번호, required: true}
      grade: {type: enum, values: [BASIC, SILVER, VIP], label: 등급}
      order_count: {type: integer, label: 주문 수, expr: "count(placed)"}
      spent: {type: decimal, unit: KRW, label: 구매 금액, description: 취소된 주문은 빼고 합한 주문 금액,
              expr: "coalesce(sum(placed.billed), 0)"}

  Category:
    label: 카테고리
    area: Category
    key: category_id
    title: name
    implements: [Named]
    properties:
      category_id: {type: string, label: 카테고리 번호, required: true}
      name: {type: string, label: 이름}
      parent_id: {type: string, label: 상위 카테고리 번호}
      returnable: {type: boolean, label: 반품 가능 카테고리, cite: 반품 정책서 v1.2 2.1조}

  Product:
    label: 상품
    area: Product
    key: product_id
    title: name
    implements: [Named]
    aligned: [https://schema.org/Product, https://gs1.org/voc/Product]
    properties:
      product_id: {type: string, label: 상품 번호, required: true}
      name: {type: string, label: 상품명}
      category_id: {type: string, label: 카테고리 번호}
      brand: {type: string, label: 브랜드}

  Sku:
    label: 단품
    area: Product
    key: sku_id
    properties:
      sku_id: {type: string, label: 단품 번호, required: true}
      product_id: {type: string, label: 상품 번호}
      size: {type: string, label: 사이즈}
      color: {type: string, label: 색상}
      price: {type: decimal, unit: KRW, label: 판매가}
      stock: {type: integer, label: 재고}
      first_price: {type: decimal, unit: KRW, label: 최초 판매가, expr: "earliest(priceChanges.price)"}
      last_price: {type: decimal, unit: KRW, label: 최근 변경 판매가, expr: "latest(priceChanges.price)"}

  PriceChange:
    label: 판매가 변경 이력
    area: Product
    key: change_id
    series: {time: changed_at, of: priceOf}
    properties:
      change_id: {type: string, label: 변경 번호, required: true}
      sku_id: {type: string, label: 단품 번호}
      changed_at: {type: datetime, label: 변경 일시}
      price: {type: decimal, unit: KRW, label: 판매가}

  Order:
    label: 주문
    area: Order
    parent: Agreement
    key: order_id
    aligned: [https://schema.org/Order]
    properties:
      order_id: {type: string, label: 주문 번호, required: true}
      customer_id: {type: string, label: 고객 번호}
      ordered_at: {type: datetime, label: 주문 일시}
      status: {type: enum, values: [ORDERED, PAID, SHIPPED, DELIVERED, CANCELLED], label: 주문 상태}
      total: {type: decimal, unit: KRW, label: 주문 금액, expr: "coalesce(sum(hasItem.line_total), 0)"}
      item_count: {type: integer, label: 주문상품 수, expr: "count(hasItem)"}
      billed: {type: decimal, unit: KRW, label: 청구 금액, description: 취소된 주문은 0,
               expr: "if(status = 'CANCELLED', 0, total)"}
    states:
      property: status
      initial: ORDERED
      states: [ORDERED, PAID, SHIPPED, DELIVERED, CANCELLED]
      transitions:
        - {from: ORDERED, to: PAID, action: pay}
        - {from: PAID, to: SHIPPED, action: ship}
        - {from: SHIPPED, to: DELIVERED, action: deliver}
        - {from: ORDERED, to: CANCELLED, action: cancel}
        - {from: PAID, to: CANCELLED, action: cancel}

  OrderItem:
    label: 주문상품
    area: Order
    key: item_id
    aligned: [https://schema.org/OrderItem]
    properties:
      item_id: {type: string, label: 주문상품 번호, required: true}
      order_id: {type: string, label: 주문 번호}
      sku_id: {type: string, label: 단품 번호}
      quantity: {type: integer, label: 수량}
      unit_price: {type: decimal, unit: KRW, label: 결제 단가}
      delivered_at: {type: datetime, label: 배송 완료 일시}
      item_status: {type: enum, values: [NORMAL, RETURN_REQUESTED, RETURNED], label: 주문상품 상태}
      line_total: {type: decimal, unit: KRW, label: 결제 금액, expr: "unit_price * quantity"}
    states:
      property: item_status
      initial: NORMAL
      states: [NORMAL, RETURN_REQUESTED, RETURNED]
      transitions:
        - {from: NORMAL, to: RETURN_REQUESTED, action: requestReturn}
        - {from: RETURN_REQUESTED, to: RETURNED, action: completeReturn}
        - {from: RETURN_REQUESTED, to: NORMAL, action: rejectReturn}

  Claim:
    label: 클레임
    area: Claim
    key: claim_id
    properties:
      claim_id: {type: string, label: 클레임 번호, required: true}
      item_id: {type: string, label: 주문상품 번호}
      kind: {type: enum, values: [RETURN, EXCHANGE, CANCEL], label: 클레임 유형}
      reason: {type: string, label: 사유}
      claimed_at: {type: datetime, label: 접수 일시}
      claim_status: {type: enum, values: [OPEN, CLOSED], label: 클레임 상태}

links:
  placed: {from: Customer, to: Order, cardinality: one_to_many, inverse: placedBy, label: 주문함}
  hasItem: {from: Order, to: OrderItem, cardinality: one_to_many, inverse: itemOf, label: 주문상품, required: true}
  ofSku: {from: OrderItem, to: Sku, cardinality: many_to_one, label: 단품}
  skuOf: {from: Sku, to: Product, cardinality: many_to_one, label: 상품}
  inCategory: {from: Product, to: Category, cardinality: many_to_one, label: 카테고리}
  broader: {from: Category, to: Category, cardinality: many_to_one, transitive: true, inverse: narrower, label: 상위 카테고리}
  hasClaim: {from: OrderItem, to: Claim, cardinality: one_to_many, inverse: claimOf, label: 클레임}
  wishes: {from: Customer, to: Product, label: 찜}
  priceOf: {from: PriceChange, to: Sku, cardinality: many_to_one, inverse: priceChanges, label: 판매가 변경 단품}

parameters:
  return_window_days: {type: integer, value: 7, min: 1, unit: 일, label: 반품 기간, cite: 반품 정책서 v1.2 3.2조}

decisions:
  returnEligibility:
    label: 반품 가능 여부
    target: OrderItem
    cite: 반품 정책서 v1.2 3조
    hit_policy: first
    inputs:
      days_since_delivery: {type: integer, days_since: delivered_at}
      item_status: {type: string, property: item_status}
      category_returnable: {type: boolean, path: [ofSku, skuOf, inCategory], property: returnable}
    outputs: {eligible: boolean, reason: string}
    rules:
      - {id: not-delivered, when: {days_since_delivery: "null"}, then: {eligible: false, reason: 배송 완료 전입니다}}
      - {id: in-progress, when: {item_status: '!= "NORMAL"'}, then: {eligible: false, reason: 이미 반품이 진행 중입니다}}
      - {id: category, when: {category_returnable: "false"}, then: {eligible: false, reason: 반품할 수 없는 카테고리입니다}, cite: 반품 정책서 v1.2 2.1조}
      - {id: in-window, when: {days_since_delivery: "<= @return_window_days"}, then: {eligible: true, reason: "배송 완료 후 반품기간 {@return_window_days}일 이내입니다"}, cite: 반품 정책서 v1.2 3.2조}
      - {id: expired, when: {}, then: {eligible: false, reason: "반품기간 {@return_window_days}일이 지났습니다"}}

actions:
  requestReturn:
    label: 반품 신청
    target: OrderItem
    parameters:
      reason: {type: string, label: 반품 사유, max_length: 200}
    criteria:
      - {decision: returnEligibility, expect: {eligible: true}}
    transition_to: RETURN_REQUESTED
    approval: true

roles:
  customer_agent:
    label: 고객 응대 Agent
    read: [Order, OrderItem, Sku, Product, Category, Claim]
    row_filters:
      Order: {eq: [$self.customer_id, {principal: customer_id}]}
      OrderItem:
        exists:
          match: {own: Order}
          edges: [[$self, itemOf, own]]
          where: {eq: [own.customer_id, {principal: customer_id}]}
    run: [myOrders, returnEligibility]
    request: [requestReturn]
    documents: [반품정책서, 교환정책서, 배송안내, 결제환불안내, 쿠폰약관, 상품평운영기준]
  support_agent:
    label: 상담원
    read: [Customer, Order, OrderItem]
    run: [customerValue, orderTotals]
    documents: [반품정책서, 교환정책서, 배송안내, 결제환불안내, 쿠폰약관, 상품평운영기준]
  operator:
    label: 운영자
    read: ["*"]
    run: ["*"]
    request: ["*"]
    execute: ["*"]
    unmask: ["*"]

queries:
  ordersOfCustomer:
    label: 고객의 주문 목록
    params: {customer: string}
    query:
      match: {c: Customer, o: Order}
      edges: [[c, placed, o]]
      where: {eq: [c.customer_id, {param: customer}]}
      return: [o.order_id, o.status, o.ordered_at]
      order: [ordered_at]
  myOrders:
    label: 내 주문 상품
    query:
      match: {o: Order, i: OrderItem}
      edges: [[o, hasItem, i]]
      return: [o.order_id, i.item_id, i.item_status]
      order: [item_id]
  revenueByCategory:
    label: 카테고리별 매출
    query:
      match: {o: Order, i: OrderItem, s: Sku, p: Product, k: Category}
      edges: [[o, hasItem, i], [i, ofSku, s], [s, skuOf, p], [p, inCategory, k]]
      where: {ne: [o.status, CANCELLED]}
      return: [{col: k.name, as: category}, {sum: i.line_total, as: revenue}, {count: i, as: items}]
      order: [-revenue]
  orderTotals:
    label: 주문별 금액
    query:
      match: {o: Order}
      return: [o.order_id, o.status, o.item_count, o.total]
      order: [order_id]
  customerValue:
    label: 구매 금액 이상 고객
    params: {least: decimal}
    example: {least: 50000}
    query:
      match: {c: Customer}
      where: {gte: [c.spent, {param: least}]}
      return: [c.customer_id, c.name, c.phone, c.order_count, c.spent]
      order: [customer_id]
  skuPrices:
    label: 단품별 판매가 변화
    query:
      match: {s: Sku}
      return: [s.sku_id, s.first_price, s.last_price, s.price]
      order: [sku_id]
  wishlistCount:
    label: 고객별 찜 수
    query:
      match: {c: Customer, p: Product}
      edges: [[c, wishes, p]]
      return: [c.name, {count: p, as: wished}]
      order: [name]

questions:
  - {id: Q1, text: "C001 고객의 주문은 몇 건인가요?", query: ordersOfCustomer, params: {customer: C001}, expect: {rows: 2}}
  - {id: Q2, text: "배송 완료 4일 된 주문상품 I1001 반품 되나요?", decision: returnEligibility, key: I1001, expect: {eligible: true}}
  - {id: Q3, text: "배송 완료 12일 지난 주문상품 I1003 반품 되나요?", decision: returnEligibility, key: I1003, expect: {eligible: false}}
  - {id: Q4, text: "속옷 주문상품 I1004 반품 되나요?", decision: returnEligibility, key: I1004, expect: {eligible: false, reason: 반품할 수 없는 카테고리입니다}}

rule_cards:
  - id: return-request-moves
    type: transition
    statement: 반품 신청이 승인되면 주문상품 상태가 정상에서 반품 요청으로 바뀝니다.
    applies_to: [object:OrderItem]
    conditions: [반품 가능 여부 판정이 가능]
    result: 주문상품 상태 NORMAL → RETURN_REQUESTED
    exceptions: [반품 신청이 반려되면 정상으로 돌아갑니다]
    source: 반품 정책서 v1.2 4조
    owner: 고객경험팀
    status: approved
    implements: [action:requestReturn, states:OrderItem]
